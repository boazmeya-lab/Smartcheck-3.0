<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCheck - Tableau de bord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Styles pour la bordure gauche arquée des cartes */
    .card-border-amber { border-left: 5px solid #f29913; }
    .card-border-green { border-left: 5px solid #27ae60; }
    .card-border-red { border-left: 5px solid #eb5757; }
    .card-border-blue { border-left: 5px solid #2f80ed; }
  </style>
</head>
<body class="bg-[#faf8f5] font-sans min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-lg relative">

  <!-- En-tête / Header -->
  <header class="pt-8 pb-4 text-center">
    <span class="text-xs font-bold tracking-widest text-slate-400 uppercase">BY SMARTECH</span>
    <h1 class="text-3xl font-extrabold text-[#1d2b3a]">
      Smart<span class="text-[#f29913]">Check</span>
    </h1>
  </header>

  <!-- VUE 1 : Tableau de bord (Accueil) -->
  <main id="page-accueil" class="px-5 flex-1 tab-content">
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
      
      <div class="flex items-center gap-2 mb-6 text-[#1d2b3a]">
        <i class="fa-solid fa-chart-pie text-xl"></i>
        <h2 class="text-xl font-bold">Tableau de bord</h2>
      </div>

      <!-- Grille des 4 cartes -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        
        <!-- Total Invités -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 card-border-amber text-center">
          <span id="total-invites" class="block text-2xl font-bold text-[#1d2b3a]">3</span>
          <span class="text-xs text-slate-400 font-medium">Total Invités</span>
        </div>

        <!-- Présents -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 card-border-green text-center">
          <span id="presents" class="block text-2xl font-bold text-[#1d2b3a]">0</span>
          <span class="text-xs text-slate-400 font-medium">Présents</span>
        </div>

        <!-- Absents -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 card-border-red text-center">
          <span id="absents" class="block text-2xl font-bold text-[#1d2b3a]">3</span>
          <span class="text-xs text-slate-400 font-medium">Absents</span>
        </div>

        <!-- Taux d'accès -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 card-border-blue text-center">
          <span id="taux-acces" class="block text-2xl font-bold text-[#1d2b3a]">0%</span>
          <span class="text-xs text-slate-400 font-medium">Taux d'accès</span>
        </div>

      </div>

      <!-- Bouton Scan -->
      <button id="btn-scan" class="w-full bg-[#f29913] active:bg-[#d8840b] text-white font-bold py-3.5 px-4 rounded-2xl shadow-md flex items-center justify-center gap-2 text-base transition">
        <i class="fa-solid fa-qrcode text-lg"></i>
        <span>Lancer un Scan</span>
      </button>

    </div>
  </main>

  <!-- VUE 2 : Scanner -->
  <main id="page-scanner" class="px-5 flex-1 tab-content hidden">
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 text-center">
      <h2 class="text-xl font-bold text-[#1d2b3a] mb-4">Scanner un QR Code</h2>
      <div class="border-2 border-dashed border-[#f29913] rounded-2xl p-8 mb-4">
        <i class="fa-solid fa-qrcode text-6xl text-[#f29913] mb-2"></i>
        <p class="text-sm text-slate-500">Placez le QR Code au centre pour scanner</p>
      </div>
      <button id="btn-valider-scan" class="w-full bg-[#27ae60] text-white font-bold py-3 rounded-2xl">
        Simuler Scan Réussi
      </button>
    </div>
  </main>

  <!-- VUE 3 : Invités -->
  <main id="page-invites" class="px-5 flex-1 tab-content hidden">
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
      <h2 class="text-xl font-bold text-[#1d2b3a] mb-4">Liste des Invités</h2>
      <ul id="liste-invites" class="space-y-3">
        <!-- Généré dynamiquement -->
      </ul>
    </div>
  </main>

  <!-- VUE 4 : Paramètres -->
  <main id="page-parametres" class="px-5 flex-1 tab-content hidden">
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
      <h2 class="text-xl font-bold text-[#1d2b3a] mb-4">Paramètres</h2>
      <div class="space-y-4 text-sm text-slate-600">
        <div class="flex justify-between items-center py-2 border-b">
          <span>Notifications</span>
          <input type="checkbox" checked class="accent-[#f29913]">
        </div>
        <div class="flex justify-between items-center py-2 border-b">
          <span>Mode Sombre</span>
          <input type="checkbox" class="accent-[#f29913]">
        </div>
        <div class="py-2">
          <span>Version de l'application</span>
          <p class="text-xs text-slate-400">v1.0.0 - SmartCheck</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Barre de navigation inférieure -->
  <nav class="bg-white border-t border-slate-100 py-3 px-6 flex justify-between items-center mt-6">
    <button data-tab="accueil" class="nav-btn flex flex-col items-center text-[#f29913]">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Accueil</span>
    </button>
    <button data-tab="scanner" class="nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-qrcode text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Scanner</span>
    </button>
    <button data-tab="invites" class="nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-users text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Invités</span>
    </button>
    <button data-tab="parametres" class="nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-gear text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Paramètres</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
