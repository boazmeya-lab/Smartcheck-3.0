<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCheck</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .card-border-amber { border-left: 5px solid #f29913; }
    .card-border-green { border-left: 5px solid #27ae60; }
    .card-border-red { border-left: 5px solid #eb5757; }
    .card-border-blue { border-left: 5px solid #2f80ed; }
  </style>
</head>
<body class="bg-[#faf8f5] font-sans min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-sm relative">

  <!-- En-tête -->
  <header class="pt-8 pb-4 text-center">
    <p class="text-[11px] font-bold tracking-widest text-slate-400 uppercase">BY SMARTECH</p>
    <h1 class="text-3xl font-extrabold text-[#1d2b3a]">
      Smart<span class="text-[#f29913]">Check</span>
    </h1>
  </header>

  <!-- PAGE ACCUEIL -->
  <main id="page-accueil" class="px-5 flex-1 tab-content">
    <div class="bg-white rounded-[28px] p-6 shadow-sm border border-slate-100">
      <div class="flex items-center gap-2 mb-6 text-[#1d2b3a]">
        <i class="fa-solid fa-chart-pie text-xl"></i>
        <h2 class="text-xl font-bold">Tableau de bord</h2>
      </div>

      <!-- Grille des 4 cartes -->
      <div class="grid grid-cols-2 gap-3 mb-6">
        <div class="bg-white p-4 rounded-2xl border border-slate-100 card-border-amber text-center shadow-sm">
          <span id="total-invites" class="block text-2xl font-bold text-[#1d2b3a]">3</span>
          <span class="text-xs text-slate-400 font-medium">Total Invités</span>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-slate-100 card-border-green text-center shadow-sm">
          <span id="presents" class="block text-2xl font-bold text-[#1d2b3a]">0</span>
          <span class="text-xs text-slate-400 font-medium">Présents</span>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-slate-100 card-border-red text-center shadow-sm">
          <span id="absents" class="block text-2xl font-bold text-[#1d2b3a]">3</span>
          <span class="text-xs text-slate-400 font-medium">Absents</span>
        </div>
        <div class="bg-white p-4 rounded-2xl border border-slate-100 card-border-blue text-center shadow-sm">
          <span id="taux-acces" class="block text-2xl font-bold text-[#1d2b3a]">0%</span>
          <span class="text-xs text-slate-400 font-medium">Taux d'accès</span>
        </div>
      </div>

      <button id="btn-scan" class="w-full bg-[#f29913] active:bg-[#d8840b] text-white font-bold py-3.5 px-4 rounded-2xl shadow-sm flex items-center justify-center gap-2 text-base transition">
        <i class="fa-solid fa-qrcode text-lg"></i>
        <span>Lancer un Scan</span>
      </button>
    </div>
  </main>

  <!-- PAGE SCANNER -->
  <main id="page-scanner" class="px-5 flex-1 tab-content hidden">
    <div class="bg-white rounded-[28px] p-6 shadow-sm border border-slate-100 text-center">
      <h2 class="text-xl font-bold text-[#1d2b3a] mb-4">Scanner QR Code</h2>
      <div class="border-2 border-dashed border-[#f29913] rounded-2xl p-8 mb-4">
        <i class="fa-solid fa-qrcode text-6xl text-[#f29913]"></i>
      </div>
      <button id="btn-simuler-scan" class="w-full bg-[#27ae60] text-white font-bold py-3.5 rounded-2xl">
        Simuler Présence (+1)
      </button>
    </div>
  </main>

  <!-- PAGE INVITÉS -->
  <main id="page-invites" class="px-5 flex-1 tab-content hidden">
    <div class="bg-white rounded-[28px] p-6 shadow-sm border border-slate-100">
      <h2 class="text-xl font-bold text-[#1d2b3a] mb-4">Liste des Invités</h2>
      <p class="text-sm text-slate-500">Gestion des accès invités.</p>
    </div>
  </main>

  <!-- PAGE PARAMÈTRES -->
  <main id="page-parametres" class="px-5 flex-1 tab-content hidden">
    <div class="bg-white rounded-[28px] p-6 shadow-sm border border-slate-100 space-y-6">
      <div class="flex items-center gap-2 text-[#1d2b3a]">
        <i class="fa-solid fa-gear text-xl"></i>
        <h2 class="text-xl font-bold">Paramètres</h2>
      </div>

      <!-- Intégration n8n -->
      <div class="space-y-3 border-b border-slate-100 pb-5">
        <label for="n8n-url" class="block text-xs font-bold text-[#1d2b3a] uppercase tracking-wider">
          Lien Webhook n8n
        </label>
        <input type="url" id="n8n-url" placeholder="https://votre-instance-n8n.com/webhook/..." 
               class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-[#f29913]">
        
        <button id="btn-test-n8n" class="w-full bg-[#1d2b3a] active:bg-[#0f172a] text-white text-xs font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-plug"></i>
          <span>Tester la connexion</span>
        </button>

        <div id="n8n-status" class="text-xs font-semibold text-center hidden"></div>
      </div>

      <!-- Action Réinitialiser -->
      <div class="space-y-3">
        <span class="block text-xs font-bold text-[#1d2b3a] uppercase tracking-wider">
          Gestion des données
        </span>
        <button id="btn-reset" class="w-full bg-[#eb5757] active:bg-[#c0392b] text-white text-xs font-bold py-3 rounded-xl flex items-center justify-center gap-2 transition">
          <i class="fa-solid fa-rotate-left"></i>
          <span>Réinitialiser les compteurs</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Navigation -->
  <nav class="bg-white border-t border-slate-100 py-3 px-6 flex justify-between items-center mt-6">
    <button data-tab="accueil" class="nav-btn flex flex-col items-center text-[#f29913]">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Accueil</span>
    </button>
    <button data-tab="scanner" class="nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-qrcode text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Scanner</span>
    </button>
    <button data-tab="invites" class="nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-users text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Invités</span>
    </button>
    <button data-tab="parametres" class="nav-btn flex flex-col items-center text-slate-400">
      <i class="fa-solid fa-gear text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Paramètres</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
