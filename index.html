<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCheck - Tableau de bord</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#faf8f5] font-sans min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-lg relative">

  <!-- En-tête / Header -->
  <header class="pt-8 pb-4 text-center">
    <span class="text-xs font-bold tracking-widest text-slate-400 uppercase">BY SMARTECH</span>
    <h1 class="text-3xl font-extrabold text-[#1d2b3a]">
      Smart<span class="text-[#f29913]">Check</span>
    </h1>
  </header>

  <!-- Contenu Principal -->
  <main class="px-5 flex-1">
    <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
      
      <!-- Titre du Tableau de bord -->
      <div class="flex items-center gap-2 mb-6 text-[#1d2b3a]">
        <i class="fa-solid fa-chart-pie text-xl"></i>
        <h2 class="text-xl font-bold">Tableau de bord</h2>
      </div>

      <!-- Grille à 4 cartes -->
      <div class="grid grid-cols-2 gap-4 mb-6">
        
        <!-- Carte 1 : Total Invités -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-[#f29913] border-y border-r border-slate-100 text-center">
          <span class="block text-2xl font-bold text-[#1d2b3a]">3</span>
          <span class="text-xs text-slate-400 font-medium">Total Invités</span>
        </div>

        <!-- Carte 2 : Présents -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-[#27ae60] border-y border-r border-slate-100 text-center">
          <span class="block text-2xl font-bold text-[#1d2b3a]">0</span>
          <span class="text-xs text-slate-400 font-medium">Présents</span>
        </div>

        <!-- Carte 3 : Absents (Nouvelle case) -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-[#eb5757] border-y border-r border-slate-100 text-center">
          <span class="block text-2xl font-bold text-[#1d2b3a]">3</span>
          <span class="text-xs text-slate-400 font-medium">Absents</span>
        </div>

        <!-- Carte 4 : Taux d'accès -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 border-[#2f80ed] border-y border-r border-slate-100 text-center">
          <span class="block text-2xl font-bold text-[#1d2b3a]">0%</span>
          <span class="text-xs text-slate-400 font-medium">Taux d'accès</span>
        </div>

      </div>

      <!-- Bouton Lancer un Scan -->
      <button class="w-full bg-[#f29913] active:bg-[#d8840b] text-white font-bold py-3.5 px-4 rounded-2xl shadow-md flex items-center justify-center gap-2 text-base transition">
        <i class="fa-solid fa-qrcode text-lg"></i>
        <span>Lancer un Scan</span>
      </button>

    </div>
  </main>

  <!-- Barre de navigation bas de page -->
  <nav class="bg-white border-t border-slate-100 py-3 px-6 flex justify-between items-center mt-6">
    <a href="#" class="flex flex-col items-center text-[#f29913]">
      <i class="fa-solid fa-house text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Accueil</span>
    </a>
    <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-qrcode text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Scanner</span>
    </a>
    <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-users text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Invités</span>
    </a>
    <a href="#" class="flex flex-col items-center text-slate-400 hover:text-slate-600">
      <i class="fa-solid fa-gear text-lg"></i>
      <span class="text-[10px] font-semibold mt-1">Paramètres</span>
    </a>
  </nav>

</body>
</html>
